<!doctype html>
<html lang="es">
<head>
<script src="../../auth-guard.js?v=20260929a"></script>
<script src="../../gp2-ui.js?v=20260930a"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro Producción · GP2</title>
<link rel="icon" type="image/png" href="../../GP2_favicon.png">
<link rel="apple-touch-icon" href="../../GP2_favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../supabase-config.js?v=20260929a"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f6f8;padding:12px;color:#111}
  .card{max-width:960px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
  .header{background:#ffffff;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .header h1{font-size:24px;font-weight:700}
  .header a{background:#fff;color:#111;padding:8px 14px;border-radius:6px;font-weight:700;font-size:18px;text-decoration:none}

  .steps{padding:14px 18px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld.grow{flex:1 1 180px}
  .fld>span{font-size:14px;color:#475569;font-weight:700}
  input[type="text"],input[type="date"],input[type="number"]{height:42px;border:2px solid #d0d7de;border-radius:8px;padding:0 12px;font-size:20px;width:100%}
  label.lbl{font-weight:800;font-size:20px}

  .btn{padding:12px 20px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:21px}
  .btn-primary{background:#111;color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:#fff;border:2px solid #d0d7de;color:#111}

  .search-box{margin:12px 0;padding:12px;background:#f6f8fa;border-radius:8px}
  .search-box input{width:100%;padding:10px;font-size:18px;border:2px solid #d0d7de;border-radius:6px}
  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0;max-height:420px;overflow-y:auto}
  .item-btn{padding:12px 8px;background:#fff;border:2px solid #d0d7de;border-radius:10px;cursor:pointer;text-align:center;transition:all .12s;overflow:hidden}
  .item-btn:hover{border-color:#111;background:#f6f8fa}
  .item-btn.active{background:#111;color:#fff;border-color:#111}
  .item-btn .code{display:block;font-size:22px;font-weight:900;color:#0066cc}
  .item-btn.active .code{color:#165298}
  .item-btn .desc{display:block;font-size:16px;margin-top:6px;font-weight:700;line-height:1.2;white-space:normal;overflow-wrap:anywhere}

  .panel{margin:12px 0;border:2px solid #d0d7de;border-radius:12px;padding:16px;background:#fbfdff}
  .panel .flow{background:#eef4fb;border:1px solid #bcd6f0;border-radius:8px;padding:12px;font-size:19px;color:#0b3b73;margin-bottom:12px}
  .panel .flow b{color:#0f2f52}
  .panel select{height:44px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:19px;width:100%;margin-bottom:12px}
  .hint{font-size:15px;color:#667085;font-style:italic}
  .msg{margin-top:10px;font-size:18px;min-height:20px}
  .msg.ok{color:#0a7a2f;font-weight:700} .msg.err{color:#b42318;font-weight:700} .msg.warn{color:#b45309;font-weight:700}

  .recent{margin-top:10px}
  .recent h2{font-size:18px;color:#333;margin:6px 0}
  /* La tabla mide ~436px: sin wrapper, a 390px Golpes y Uni quedaban afuera de
     la pantalla y sin scroll (2026-09-03). */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.rec{width:100%;min-width:420px;border-collapse:collapse;font-size:16px}
  table.rec th{color:#555;text-align:left;padding:7px 8px;border-bottom:2px solid #e5e9ee;font-size:13px;text-transform:uppercase}
  table.rec td{padding:8px;border-bottom:1px solid #eef1f4}
  table.rec td.n{text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:#888;padding:14px;text-align:center;font-style:italic}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Registro Producción</h1>
    <a href="../../GP2_MODULOS.html">Atrás</a>
  </div>

  <div class="steps">
    <div class="row">
      <div class="fld grow"><span>Fecha</span><input type="date" id="fFecha"></div>
      <div class="fld grow"><span>Legajo</span><input type="text" id="fLegajo" inputmode="numeric" placeholder="Legajo del operario"></div>
      <div class="fld grow"><span>Nombre (opcional)</span><input type="text" id="fNombre" placeholder="Nombre"></div>
    </div>

    <div class="row"><label class="lbl">Matriz</label></div>
    <div class="search-box"><input type="text" id="q" placeholder="Buscar matriz por N° o nombre…" oninput="renderMats()"></div>
    <div class="items-grid" id="matGrid"></div>

    <div id="panel" class="panel" style="display:none">
      <div id="flow" class="flow"></div>
      <div id="salidaWrap"></div>
      <div class="row" style="align-items:flex-end">
        <div class="fld grow"><span>Golpes del contador</span><input inputmode="numeric" type="number" id="fGolpes" min="1" step="1" placeholder="0" oninput="pintarUni()"></div>
        <div class="fld grow"><span>Unidades producidas</span><input inputmode="numeric" type="number" id="fUni" min="1" step="1" placeholder="0" readonly style="background:#f1f5f9;font-weight:900"></div>
        <button class="btn btn-primary" id="btnGuardar" onclick="guardar()">Guardar producción</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="recent">
      <h2>Últimos registros</h2>
      <div id="tabla"><p class="empty">—</p></div>
    </div>
  </div>
</div>

<script>
const SB=GP2_SB();
var $ = GP2UI.$;
let D=null, matSel=null, matKeys=[];
/* HOY es el de ARGENTINA (GP2UI.hoyAR), no el del aparato. Tenia su propio hoy() con
   getFullYear/getMonth/getDate, que lee la zona del dispositivo: en una tablet o un celular en
   UTC, despues de las 21:00 de Argentina devolvia el DIA SIGUIENTE, y con eso se precarga la
   fecha del registro de produccion. [2026-09-12, hallazgo 14c del informe de logica duplicada] */
var hoy = GP2UI.hoyAR;
var esc = GP2UI.esc;   /* helper de la casa, gp2-ui.js (2026-09-05) */
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function cById(cid){return (D&&D.comp[String(cid)])||{cod:'?',d:''};}
/* El contador de la matriz cuenta GOLPES; cuantas piezas salen por golpe lo dice la
   base (GP2.matriz.uni_x_golpe), no el operario. Asi el dia que cambia la matriz se
   toca un solo numero y nadie tiene que recordar el factor. */
function uniXGolpe(){var v=Number((D&&D.mat[matSel]||{}).uxg);return v>0?v:1;}
function pintarUni(){
  var g=Number($('fGolpes').value)||0;
  $('fUni').value = g>0 ? g*uniXGolpe() : '';
}
function paresMatriz(mid){var set={};for(var rid in D.rp)D.rp[rid].forEach(p=>{if(p.tipo==='matriz'&&p.mat==mid&&p.ce&&p.cs)set[p.ce+'>'+p.cs]=[p.ce,p.cs];});return Object.values(set);}

function renderMats(){
  if(!D)return;
  var q=norm($('q').value.trim());
  var keys=matKeys.filter(k=>{var m=D.mat[k];
    if(m.act===false) return false;               // matriz dada de baja: no se ofrece
    return !q||norm('N°'+m.n+' '+(m.d||'')).indexOf(q)>=0;});
  var g=$('matGrid'); g.innerHTML='';
  keys.slice(0,300).forEach(k=>{
    var m=D.mat[k];
    var b=document.createElement('button'); b.className='item-btn'+(String(matSel)===String(k)?' active':'');
    b.innerHTML='<span class="code">N°'+esc(m.n)+'</span><span class="desc">'+esc(m.d||'')+'</span>';
    b.addEventListener('click',()=>selMat(k));
    g.appendChild(b);
  });
}
function selMat(k){
  matSel=k; renderMats();
  var mid=parseInt(k), mat=D.mat[k]||{}, pares=paresMatriz(mid);
  var flow=$('flow'), sw=$('salidaWrap');
  sw.innerHTML='';
  if(pares.length===0){
    flow.innerHTML='<b>Esta matriz no tiene entrada→salida en las rutas.</b> Se registra la producción pero <b>no mueve stock</b>.';
  } else if(pares.length===1){
    var ce=cById(pares[0][0]), cs=cById(pares[0][1]);
    flow.innerHTML='<b>Entrada:</b> '+esc(ce.cod)+' — '+esc(ce.d)+'<br><b>Salida:</b> '+esc(cs.cod)+' — '+esc(cs.d);
    sw.innerHTML='<input type="hidden" id="fSalida" value="'+pares[0][1]+'">';
  } else {
    flow.innerHTML='<b>Elegí qué pieza produjo:</b>';
    var h='<select id="fSalida"><option value="">— Elegí pieza —</option>';
    pares.forEach(par=>{var ce=cById(par[0]),cs=cById(par[1]);h+='<option value="'+par[1]+'">'+esc(cs.cod)+' — '+esc((cs.d||'').substring(0,40))+'  (de '+esc(ce.cod)+')</option>';});
    h+='</select>'; sw.innerHTML=h;
  }
  if(mat.ppk) flow.innerHTML+='<br><span class="hint">Rendimiento: '+mat.ppk+' uni/kg de fleje (primer corte).</span>';
  var uxg=uniXGolpe();
  flow.innerHTML+='<br><span class="hint">'+(mat.maq?esc(mat.maq).toUpperCase()+' · ':'')+
    (uxg===1?'1 golpe = 1 unidad.':'cada golpe saca <b>'+uxg+'</b> unidades.')+'</span>';
  $('fGolpes').value=''; pintarUni();
  $('panel').style.display=''; $('msg').textContent=''; $('msg').className='msg';
}

async function cargarMatrices(){
  var res=await SB.rpc('movimientos_bundle');
  if(res.error){$('matGrid').innerHTML='<p class="empty">Error: '+esc(res.error.message)+'</p>';return;}
  D=res.data; for(var r in D.rp)D.rp[r].sort((a,b)=>a.o-b.o);
  matKeys=Object.keys(D.mat).sort((a,b)=>String(D.mat[a].n).localeCompare(String(D.mat[b].n),undefined,{numeric:true}));
  renderMats();
}
async function cargarUltimos(){
  var res=await SB.from('produccion').select('fecha,legajo,nombre_empleado,matriz_raw,nombre_matriz,uni,golpes').order('id',{ascending:false}).limit(30);
  var t=$('tabla');
  if(res.error){t.innerHTML='<p class="empty">Error cargando</p>';return;}
  var data=res.data||[];
  if(!data.length){t.innerHTML='<p class="empty">Sin registros todavía</p>';return;}
  t.innerHTML='<div class="table-wrap"><table class="rec"><thead><tr><th>Fecha</th><th>Legajo</th><th>Nombre</th><th>Matriz</th><th class="n">Golpes</th><th class="n">Uni</th></tr></thead><tbody>'+
    data.map(r=>{var f=r.fecha?new Date(r.fecha).toLocaleDateString('es-AR'):'';
      return '<tr><td>'+f+'</td><td>'+esc(r.legajo||'')+'</td><td>'+esc(r.nombre_empleado||'')+'</td><td>'+esc(r.matriz_raw||'')+' · '+esc(r.nombre_matriz||'')+'</td><td class="n">'+(r.golpes==null?'—':r.golpes)+'</td><td class="n">'+(r.uni==null?'':r.uni)+'</td></tr>';}).join('')+
    '</tbody></table></div>';
}
async function guardar(){
  var m=$('msg'); m.className='msg'; m.textContent='';
  var golpes=parseFloat($('fGolpes').value);
  if(!matSel){m.className='msg err';m.textContent='Elegí una matriz.';return;}
  if(!golpes||golpes<=0){m.className='msg err';m.textContent='Ingresá los golpes del contador (> 0).';return;}
  var uxg=uniXGolpe(), uni=golpes*uxg;
  if(uxg>1 && !confirm('Matriz '+((D.mat[matSel]||{}).n)+': '+golpes+' GOLPES x '+uxg+' = '+uni+' unidades.\n\n¿Los '+golpes+' son golpes del contador (no unidades)?')) return;
  var matN=(D.mat[matSel]||{}).n;
  var salEl=$('fSalida'); var salida=salEl?(salEl.value||null):null;
  var pares=paresMatriz(parseInt(matSel));
  if(pares.length>1 && !salida){m.className='msg err';m.textContent='Elegí qué pieza produjo.';return;}
  $('btnGuardar').disabled=true;
  try{
    var fiso=$('fFecha').value?($('fFecha').value+'T12:00:00'):null;
    var res=await SB.rpc('registrar_produccion',{p_legajo:$('fLegajo').value||null,p_matriz:String(matN),
      p_golpes:golpes,p_fecha:fiso,p_nombre:$('fNombre').value||null,p_comp_salida_id:salida?Number(salida):null});
    if(res.error) throw res.error;
    var d=res.data||{};
    if(d.aviso){ m.className='msg warn'; m.textContent='✓ Registrado (id '+d.id+'). '+d.aviso; }
    else { m.className='msg ok'; m.textContent='✓ Guardado (id '+d.id+') — '+(d.nombre_matriz||matN)+' · '+golpes+' golpes x '+uxg+' = '+(d.uni||uni)+' uni. Stock actualizado (mov '+d.movimiento_id+').'; }
    $('fGolpes').value=''; $('fUni').value='';
    await cargarUltimos();
  }catch(e){ m.className='msg err'; m.textContent='Error: '+(e.message||e); }
  finally{ $('btnGuardar').disabled=false; }
}
$('fFecha').value=hoy();
cargarMatrices(); cargarUltimos();
</script>
</body></html>
