# Publica el repo en Cloudflare Workers (archivos estáticos) en cada push a main.
# El token NO va en el repo: se cargan 2 secrets cifrados en
# Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   (token con permisos de Workers + Zone de loeke-erp.com)
#   CLOUDFLARE_ACCOUNT_ID  (account id de Cloudflare)
# wrangler lee esas 2 variables de entorno y hace el deploy segun wrangler.jsonc.
name: Deploy a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wrangler deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
