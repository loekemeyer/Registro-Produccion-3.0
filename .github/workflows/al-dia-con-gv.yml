name: Virgilio al día con GV (operario)

# D3 (Luis, 16/10/2026: «sí. pero que sea solo para cambios del modulo de operarios»).
# Mira si Gestión Virgilio cambió algo de la botonera del OPERARIO que acá todavía no está. Corre
# tests/virgilio-al-dia-con-gv.cjs = tools/traer_de_gv.cjs --revisar: lo de supervisor y monitor y los
# cambios que son sólo un número de versión (?v=, SW_VERSION) NO cuentan, así que no avisa por eso.
# GV es público: se baja en cada corrida acá, en GitHub, sin token y sin que nadie haga nada.
#
# El aviso es UN issue con la etiqueta `atraso-gv` (mismo criterio que el CI de GV, v21.53): se abre
# cuando GV tiene algo de operario sin traer, suma un comentario sólo si GV avanzó de commit, y se
# CIERRA SOLO cuando RP3.0 se pone al día. Para ponerlo al día: pedirle a Claude
# «Traé lo nuevo de GV a Reg Prod 3.0 en Virgilio» (node tools/traer_de_gv.cjs …, CLAUDE.md).
on:
  schedule:
    - cron: "17 10-23 * * 1-6"   # cada hora de 7:17 a 20:17 (Buenos Aires), lunes a sábado
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: al-dia-con-gv
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bajar Gestión Virgilio (sólo lectura)
        id: gv
        run: |
          git clone -q --filter=blob:none https://github.com/loekemeyer/Gestion-Virgilio "$RUNNER_TEMP/gv"
          echo "sha=$(git -C "$RUNNER_TEMP/gv" rev-parse --short origin/main)" >> "$GITHUB_OUTPUT"
      - name: ¿Hay algo de operario sin traer?
        id: rev
        continue-on-error: true
        env:
          GV_REPO: ${{ runner.temp }}/gv
        run: |
          set -o pipefail
          node tests/virgilio-al-dia-con-gv.cjs 2>&1 | tee /tmp/revisar.txt
      - name: Avisar / dar por cerrado
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ATRASADO: ${{ steps.rev.outcome == 'failure' }}
          GV_SHA: ${{ steps.gv.outputs.sha }}
        with:
          script: |
            const fs = require("fs");
            const atrasado = process.env.ATRASADO === "true", gv = process.env.GV_SHA || "?";
            const LABEL = "atraso-gv";
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const abiertos = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: LABEL, per_page: 5 });
            const issue = abiertos.data[0];
            if (!atrasado) {
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `✅ Virgilio de RP3.0 quedó al día con GV \`${gv}\`. [Ver el run](${run})` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              }
              return;
            }
            let detalle = "";
            try { detalle = fs.readFileSync("/tmp/revisar.txt", "utf8").trim(); } catch (_e) {}
            if (!detalle) detalle = "(no se pudo leer la salida; ver el log del run)";
            const cuerpo = [
              `Gestión Virgilio (\`${gv}\`) tiene cambios del **módulo de operarios** que Virgilio de RP3.0 todavía no tiene.`, "",
              "```", detalle.slice(0, 6000), "```", "",
              `[Ver el run](${run})`, "",
              "Para traerlo: pedirle a Claude «Traé lo nuevo de GV a Reg Prod 3.0 en Virgilio».",
              "Este issue lo abre y lo cierra el control solo: mientras esté abierto, RP3.0 está atrasado.",
            ].join("\n");
            if (!issue) {
              await github.rest.issues.create({ ...context.repo, title: "🟠 Virgilio de RP3.0 atrasado con el operario de GV",
                labels: [LABEL], body: cuerpo });
              return;
            }
            // una corrida por hora: sólo se comenta si GV avanzó desde el último aviso (si no, es ruido)
            const coms = await github.rest.issues.listComments({ ...context.repo, issue_number: issue.number, per_page: 100 });
            const textos = [issue.body || ""].concat(coms.data.map((c) => c.body || ""));
            if (!textos.some((t) => t.includes("`" + gv + "`"))) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: cuerpo });
            }
